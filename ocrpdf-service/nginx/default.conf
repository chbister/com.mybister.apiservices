# Docker-embedded DNS: die Upstream-IP wird regelmäßig neu aufgelöst.
# Ohne "resolve" merkt sich nginx die IP vom Startzeitpunkt – nach jeder
# Neuerstellung des ocrpdf-Containers (Deploy!) endet alles in 502
# "connect() failed (111: Connection refused)".
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ocr_service {
    # zone ist für "resolve" Pflicht: die zur Laufzeit neu aufgelösten
    # Adressen müssen zwischen den Workern geteilt werden.
    zone ocr_service 64k;
    least_conn;
    server ocrpdf:3000 resolve;
}

server {
    listen 3000;
    client_max_body_size 48M;
    location / {
        proxy_pass http://ocr_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
