name: Deploy to self-hosted runners

run-name: Deploy ${{ inputs.target && format('to {0}', inputs.target) || 'to all hosts (auto)' }}

on:
  workflow_run:
    workflows:
      - Build and Push Docker Images
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: "Runner on which the deployment runs"
        type: choice
        options:
          - b01
          - b02
          - b03
        required: true
        default: b01
      prune:
        description: "Stop services not assigned to this runner"
        type: boolean
        default: false

jobs:
  # The matrix context is not allowed in a job-level "if", so the target
  # list is computed here: manual runs deploy to the selected runner only,
  # automatic runs to all three.
  plan:
    name: Determine target runners
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, com-mybister-apiservices]
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Select targets
        id: select
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'targets=["${{ inputs.target }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'targets=["b01","b02","b03"]' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: [self-hosted, com-mybister-apiservices, "${{ matrix.target }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # Free disk space before pulling: stale containers, dangling images
      # and build cache from older deployments pile up on the runners.
      - name: Clean up docker system
        run: docker system prune --force

      # The service list comes from the registry placement
      # (tools/service_registry.json, field "host"): all services and
      # components assigned to this runner, apikey-auth included ("*").
      - name: Start services of this host
        run: |
          SERVICES="$(python3 tools/deploy_targets.py "${{ matrix.target }}")"
          read -r -a SVC <<< "$SERVICES"
          echo "Starting on ${{ matrix.target }}: ${SVC[*]}"
          SCALE=()
          case " ${SVC[*]} " in *" barcode "*) SCALE+=(--scale barcode=2) ;; esac
          case " ${SVC[*]} " in *" metadata "*) SCALE+=(--scale metadata=2) ;; esac
          docker compose --env-file /home/theuser/__dotenv__/env.apiservices pull "${SVC[@]}"
          docker compose --env-file /home/theuser/__dotenv__/env.apiservices up -d "${SCALE[@]}" "${SVC[@]}"
          docker image prune -f

      - name: Stop services not assigned to this host
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prune }}
        run: |
          OTHERS="$(python3 tools/deploy_targets.py "${{ matrix.target }}" --others)"
          read -r -a REST <<< "$OTHERS"
          if [ "${#REST[@]}" -gt 0 ]; then
            docker compose --env-file /home/theuser/__dotenv__/env.apiservices rm -sf "${REST[@]}"
          fi
