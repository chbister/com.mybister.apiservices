name: Deploy to self-hosted runners

run-name: Deploy to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Runner on which the deployment runs"
        type: choice
        options:
          - b01
          - b02
          - b03
        required: true
        default: b01

jobs:
  deploy:
    name: Deploy (prod) to ${{ inputs.target }}
    runs-on: [self-hosted, com-mybister-apiservices, "${{ inputs.target }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Deploy profile
        run: |
          docker compose --env-file /home/theuser/__dotenv__/env.apiservices --profile prod pull
          docker compose --env-file /home/theuser/__dotenv__/env.apiservices --profile prod up -d
          docker image prune -f
