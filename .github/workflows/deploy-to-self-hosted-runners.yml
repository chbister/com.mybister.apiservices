name: Deploy to self-hosted runners

run-name: Deploy to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Runner on which the deployment runs"
        type: choice
        options:
          - b01
          - b02
          - b03
        required: true
        default: b01

jobs:
  deploy:
    name: Start base (apikey-auth) on ${{ inputs.target }}
    runs-on: [self-hosted, com-mybister-apiservices, "${{ inputs.target }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # Minimal base: only the ForwardAuth middleware every production router
      # references. All other services are started manually on the host
      # (docker compose --profile prod up -d <services>).
      - name: Start base profile (apikey-auth)
        run: |
          docker compose --env-file /home/theuser/__dotenv__/env.apiservices --profile base up -d
